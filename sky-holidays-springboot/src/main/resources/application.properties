server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sky_holidays?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB
app.upload-dir=${UPLOAD_DIR:uploads}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
app.admin.email=${ADMIN_EMAIL:admin@skyholidays.com}
app.admin.password=${ADMIN_PASSWORD}
app.upi-id=${UPI_ID:}
spring.web.resources.cache.period=0
spring.web.resources.static-locations=classpath:/static/
