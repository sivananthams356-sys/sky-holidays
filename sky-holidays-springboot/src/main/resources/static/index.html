<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <script>try{var s=localStorage.getItem("sky_theme");if(s)document.documentElement.setAttribute("data-theme",s)}catch(e){}</script>
    <link rel="icon" id="fav" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sky Holidays – Travel More, Worry Less</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
    <style>
        :root{--ink:#0b0f17;--panel:#141a25;--gold:#fbbf24;--gold2:#f59e0b;--bg:#f3f5f9;--card:#fff;--txt:#1b2230;--mut:#6b7585;--line:#e5e9f0;--ok:#16a34a;--warn:#f97316;--bad:#dc2626;--sat-top:env(safe-area-inset-top,0px);--sat-bot:env(safe-area-inset-bottom,0px);box-sizing:border-box;padding-top:var(--sat-top);padding-bottom:var(--sat-bot)}
        :root:not([data-theme="light"]){}
        @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131c;--card:#171e2a;--txt:#e8ecf3;--mut:#93a0b4;--line:#263042}}
        :root[data-theme="dark"]{--bg:#0e131c;--card:#171e2a;--txt:#e8ecf3;--mut:#93a0b4;--line:#263042}
        html{scroll-padding-top:env(safe-area-inset-top,0px)}
        *,*:before,*:after{box-sizing:inherit}
        body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
        button,input,select,textarea{font:inherit}
        button{cursor:pointer}
        :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
        .btn{background:var(--gold);color:#111;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
        .btn:hover{background:var(--gold2)}
        .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
        .btn.sm{padding:6px 12px;font-size:12px}
        .dark{background:var(--ink);color:#fff}
        /* landing */
        .hero{min-height:100vh;background:linear-gradient(180deg,rgba(8,12,20,.35),rgba(8,12,20,.95)),linear-gradient(160deg,#274a3a 0%,#16283a 45%,#0b0f17 100%);position:relative;overflow:hidden}
        .nav{display:flex;align-items:center;gap:18px;padding:16px 5vw;flex-wrap:wrap}
        .logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--gold);font-size:20px;font-style:italic}
        .logo i{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-style:normal;font-size:18px;background:#000}
        .nav a.l{color:#fff;text-decoration:none;font-size:13px;opacity:.9;cursor:pointer}
        .nav .sp{flex:1}
        .hero-in{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;padding:6vh 5vw;align-items:center}
        .hero h1{font-size:clamp(40px,7vw,76px);margin:6px 0;color:var(--gold);font-weight:800;line-height:1}
        .hero p.s{font-size:20px;font-weight:500;margin:8px 0}
        .tag{display:inline-block;background:var(--gold);color:#111;font-weight:700;border-radius:20px;padding:5px 14px;margin:10px 0 24px}
        .svc{display:flex;gap:16px;flex-wrap:wrap}
        .svc button{background:none;border:0;color:#fff;font-weight:600;font-size:12px;text-align:center;width:84px}
        .svc b{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border:2px solid var(--gold);border-radius:12px;font-size:24px;background:rgba(0,0,0,.4)}
        .bus{font-size:clamp(120px,20vw,240px);text-align:center;filter:drop-shadow(0 20px 30px #000a);line-height:1}
        .road{height:10px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 40px,transparent 40px 70px);opacity:.7;margin-top:6px;animation:rd 2.4s linear infinite}
        @keyframes rd{to{background-position:70px 0}}
        @media (prefers-reduced-motion:reduce){.road{animation:none}}
        .plan{display:flex;gap:20px;align-items:center;padding:20px 5vw 40px;flex-wrap:wrap;background:var(--ink)}
        .plan h2{margin:0;font-size:22px;min-width:200px}
        .dest{display:flex;gap:14px;flex-wrap:wrap;flex:1}
        .dest div{flex:1;min-width:120px;height:110px;border-radius:12px;padding:10px;display:flex;align-items:flex-end;font-weight:600;color:#fff;font-size:13px}
        .packs{padding:40px 5vw;background:var(--bg)}
        .packs h2{margin:0 0 18px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
        .pic{height:110px;border-radius:10px;display:grid;place-items:center;font-size:44px;margin-bottom:10px}
        .foot{background:var(--ink);color:#fff;padding:20px 5vw;display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
        .foot em{color:var(--gold);font-size:20px}
        /* auth */
        .auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(rgba(8,12,20,.8),rgba(8,12,20,.9)),linear-gradient(160deg,#274a3a,#0b0f17);padding:20px}
        .abox{width:min(380px,100%);border:1.5px solid var(--gold);border-radius:22px;padding:28px;background:rgba(10,14,22,.85);color:#fff;text-align:center}
        .abox h2{margin:14px 0 2px}
        .abox p{margin:0 0 16px;font-size:12px;color:#cbd2de}
        .abox input{width:100%;margin-bottom:12px;background:transparent;border:1.5px solid #8b94a5;color:#fff;border-radius:8px;padding:11px 12px}
        .abox .btn{width:100%;margin-bottom:12px}
        .abox a{color:var(--gold);cursor:pointer;font-weight:600}
        .err{color:#fca5a5;font-size:12px;min-height:16px;margin-bottom:6px}
        /* app shell */
        .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
        .side{background:var(--ink);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
        .side .logo{padding:4px 6px 16px;font-size:16px}
        .side small{display:block;font-size:10px;color:#9aa3b2;font-style:normal;font-weight:400}
        .side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:#dbe0ea;cursor:pointer;margin-bottom:4px;font-size:13px;text-decoration:none}
        .side a.on{background:var(--gold);color:#111;font-weight:600}
        .main{padding:20px 24px;min-width:0}
        .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
        .top h2{margin:0;font-size:20px}.top p{margin:2px 0 0;color:var(--mut);font-size:12px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
        .stat{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
        .stat i{font-style:normal;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:20px}
        .stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--mut)}
        .two{display:grid;grid-template-columns:2fr 1fr;gap:16px}
        .tw{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
        td{padding:10px;border-bottom:1px solid var(--line)}
        .th{width:54px;height:40px;border-radius:8px;display:grid;place-items:center;font-size:22px}
        .pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:#dcfce7;color:#15803d}
        .pill.Pending{background:#ffedd5;color:#c2410c}.pill.Cancelled{background:#fee2e2;color:#b91c1c}
        .pill.Unavailable{background:#fee2e2;color:#b91c1c}
        .ic{background:none;border:0;font-size:16px;padding:4px}
        .donut{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center}
        .donut b{width:98px;height:98px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px}
        .lg{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;margin:4px 0}
        .qa{display:flex;flex-direction:column;gap:8px;margin-top:10px}
        .qa button{text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px}
        .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
        .tile{border:0;border-radius:12px;color:#fff;padding:18px;text-align:left;font-weight:600;font-size:15px}
        .tile small{display:block;font-weight:400;opacity:.85;font-size:11px;margin-top:4px}
        .banner{border-radius:14px;padding:40px 28px;color:#fff;background:linear-gradient(90deg,#0b0f17 40%,#0b0f1700),linear-gradient(120deg,#2d5a45,#6b4a2a);min-height:180px}
        .banner h3{font-size:26px;margin:0 0 14px;line-height:1.2}
        .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        .f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);flex:1;min-width:130px}
        .f input,.f select,.f textarea{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:8px;padding:9px}
        .modal{position:fixed;inset:0;background:#000a;display:grid;align-items:start;justify-items:center;padding:16px;z-index:9;overflow-y:auto}
        .mb{background:var(--card);border-radius:14px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;margin:auto}
        .mb h3{margin:0}
        .toast{position:fixed;left:50%;bottom:calc(20px + var(--sat-bot));transform:translateX(-50%);background:var(--ink);color:#fff;border-left:4px solid var(--gold);padding:10px 18px;border-radius:8px;z-index:10}
        .menu{display:none}
        @media (max-width:820px){.hero-in,.two{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}.side .logo{width:100%}.side a{margin:0}.main{padding:14px}}

        :root{color-scheme:light}
        @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
        :root[data-theme="dark"]{color-scheme:dark}
        .side{background:linear-gradient(180deg,#05070b,#101826)}
        .logo-img{display:block;mix-blend-mode:lighten;max-width:100%;height:auto}
        .brand{text-align:center;padding:2px 0 14px}.brand .logo-img{width:150px;margin:0 auto}.brand small{display:block;margin-top:2px;font-size:11px;color:#9aa3b2;letter-spacing:.08em;text-transform:uppercase}
        .herologo .logo-img{width:min(470px,92%);margin:0 auto;filter:drop-shadow(0 18px 40px rgba(251,191,36,.25))}
        .theme-btn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:6px 12px;font-size:13px}
        .nav .theme-btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
        .auth{position:relative}.auth .theme-btn{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
        .hero-card{border-radius:18px;padding:22px 24px;color:#fff;background:radial-gradient(circle at 92% 8%,rgba(251,191,36,.38),transparent 46%),linear-gradient(135deg,#0b0f17,#1f2a3d);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px;border:1px solid rgba(251,191,36,.28)}
        .hero-card h2{margin:0 0 4px;font-size:22px}.hero-card p{margin:0;opacity:.82;font-size:13px}
        .chips{display:flex;gap:10px;flex-wrap:wrap}.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:8px 14px;min-width:120px}.chip b{display:block;font-size:18px;color:var(--gold)}.chip span{font-size:11px;opacity:.8}
        .card{box-shadow:0 1px 3px rgba(0,0,0,.06)}
        .stat{transition:transform .2s,box-shadow .2s}.stat:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.14)}
        .stat i{box-shadow:0 6px 14px rgba(0,0,0,.18)}
        .tile{display:flex;flex-direction:column;gap:6px;min-height:120px;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 20px rgba(0,0,0,.18)}.tile:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.26)}.tile i{font-style:normal;font-size:32px;line-height:1}
        .sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sec h3{margin:0;font-size:16px}
        .strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}.strip .card{min-width:230px;flex:0 0 auto}
        .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
        .qa button:hover{border-color:var(--gold)}
        @media (prefers-reduced-motion:reduce){.stat,.tile{transition:none}}

    async function api(path,opt){const o=Object.assign({credentials:'same-origin'},opt||{});if(o.json){o.method=o.method||'POST';o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(o.json)}
        let r;try{r=await fetch('/api'+path,o)}catch(e){throw new Error('Cannot reach the server. Start the Spring Boot app and open http://localhost:8080 in your browser.')}const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&!path.startsWith('/auth')&&path!='/me'){S.user=null;go('#/login');render()}else if(r.status==403){try{S.user=(await(await fetch('/api/me',{credentials:'same-origin'})).json()).user||null}catch(e){S.user=null}render()}throw new Error(d.error||'Something went wrong. Try again.')}return d}
    async function refresh(q){try{const c=await api('/catalog');Object.keys(EM).forEach(k=>S[k]=c[k].map(x=>Object.assign(x,{e:EM[k]})));S.exps=(await api('/experiences')).map(x=>Object.assign(x,{e:'🎉'}));S.trips=(await api('/trips')).map(x=>Object.assign(x,{e:'🌴'}));
        if(S.user){S.cfg=await api('/config');S.bookings=await api('/bookings');S.treq=await api('/trip-requests');if(S.user.role=='admin'){S.users=await api('/admin/users');S.enq=await api('/admin/enquiries')}}}catch(e){if(!q)toast(e.message)}}

    const $=s=>document.querySelector(s),R=n=>'₹'+Number(n||0).toLocaleString('en-IN');
    const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

            m.addEventListener('input',upd);m.addEventListener('change',upd);upd();
            m.onclick=ev=>{if(ev.target.dataset.x!==undefined||ev.target==m)m.remove();if(ev.target.dataset.ok!==undefined)run(async()=>{const dt=fixed||$('#td2').value;if(!dt||(!fixed&&(dt<mn||dt>mx)))return toast('Choose a valid date: today up to 1 year ahead.');const q=people();if(q>500)return toast('Enter a valid number of people.');
                const pm=$('#tpm2').value,send=ref=>api('/trips/'+t.id+'/book',{json:{people:q,date:dt,pay_method:pm,pay_ref:ref}}),finish=async msg=>{m.remove();toast(msg);await refresh();go('#/app/mybk');render()};
                if(pm=='UPI'){payPage({title:'Pay for '+t.title,total:t.amount*q,lines:[{name:t.title+' × '+q,amount:t.amount*q}],done:async ref=>{await send(ref);await finish('Booked! Admin will verify your payment.')}});return}
                await send('');await finish('Booked! Pay at arrival.')})}}
        else if(d.treq!==undefined){run(async()=>{const loc=$('#rl').value.trim(),dt=$('#rd').value,ppl=parseInt($('#rp').value),bud=$('#rb').value.trim(),con=$('#rc').value.trim().replace(/[\s-]/g,''),note=$('#rn').value.trim();
            if(loc.length<2)return toast('Enter the location you want to visit.');if(!dt||dt<dstr(0)||dt>dstr(365))return toast('Choose a valid travel date.');if(!(ppl>=1&&ppl<=1000))return toast('Enter the number of people.');if(!/^\+?[0-9]{10,13}$/.test(con))return toast('Enter a valid contact number (10 digits).');
            await api('/trip-requests',{json:{category:d.treq,location:loc,date:dt,people:ppl,budget:bud,contact:con,note:note}});toast('Request sent! Our team will contact you.');await refresh();render()})}
        else if(d.delb!==undefined){const b=S.bookings[+d.delb];if(confirm('Delete this booking? Use this to clear test bookings.'))run(async()=>{await api('/admin/bookings/'+b.id,{method:'DELETE'});toast('Booking deleted');await after()})}
        else if(d.tt!==undefined){toggleTheme()}
        else if(d.qrup!==undefined){run(async()=>{const f=$('#qrf').files[0];if(!f)return toast('Choose your QR image first.');if(f.size>5*1048576)return toast('QR image must be under 5 MB.');const fd=new FormData();fd.append('file',f);await api('/admin/settings/qr',{method:'POST',body:fd});toast('QR saved');await after()})}
        else if(d.qrdel!==undefined){if(confirm('Remove the QR image?'))run(async()=>{await api('/admin/settings/qr',{method:'DELETE'});toast('QR removed');await after()})}
        else if(d.upi!==undefined){run(async()=>{const v=$('#upiid').value.trim();await api('/admin/settings',{method:'PUT',json:{upi:v}});toast(v?'UPI ID saved':'UPI turned off');await after()})}
        else if(d.paid){run(async()=>{await api('/bookings/'+S.bookings[+d.paid].id+'/paid',{method:'PATCH'});toast('Marked as paid');await after()})}
        else if(d.bk){const[k,i]=d.bk.split(':'),r=S[k][+i];if(r.status=='Unavailable')return toast('This item is currently unavailable.');
            const isB=k=='buses',isR=k=='rooms',priced=!(k=='buses'||k=='places'),upiOn=!!((S.cfg&&S.cfg.upi)||(S.cfg&&S.cfg.qr)),mn=dstr(0),mx=dstr(365);
            const m=modal('Book '+esc(r.name),`<label class="f">${isR?'Check-in date':'Travel date'}<input type="date" id="bd" min="${mn}" max="${mx}"></label>${isB||isR?`<label class="f">${isR?'No. of nights':'No. of days'}<input type="number" id="bdays" min="1" max="60" value="1"></label>`:''}${isB?'':`<label class="f">${isR?'No. of rooms':'No. of people'}<input type="number" id="bn" min="1" max="100" value="1"></label>`}${priced?`<div style="font-weight:700">Total: <span id="btot"></span></div><label class="f">Payment method<select id="bpm"><option value="Cash">Pay at arrival / counter</option>${upiOn?'<option value="UPI">UPI (scan QR &amp; pay)</option>':'<option value="UPI" disabled>UPI (not available yet)</option>'}</select></label><div id="upibox" style="display:none;font-size:12px;color:var(--mut)">The QR code opens on the next screen.</div>`:'<div style="font-size:12px;color:var(--mut)">The price is confirmed by our team. No payment is needed now.</div>'}`,'Confirm Booking');
            const num=(id,d)=>{const e=$(id);return e?(parseInt(e.value)||d):d};
            const tot=()=>r.price*(isB||isR?Math.max(1,num('#bdays',1)):1)*(isB?1:Math.max(1,num('#bn',1)));
            const upd=()=>{if(!priced)return;$('#btot').textContent=R(tot());const u=$('#bpm').value=='UPI';$('#upibox').style.display=u?'block':'none';m.querySelector('[data-ok]').textContent=u?'Continue to Pay':'Confirm Booking'};
            m.addEventListener('input',upd);m.addEventListener('change',upd);upd();
            m.onclick=ev=>{if(ev.target.dataset.x!==undefined||ev.target==m)m.remove();if(ev.target.dataset.ok!==undefined)run(async()=>{const dt=$('#bd').value;if(!dt||dt<mn||dt>mx)return toast('Choose a valid date: today up to 1 year ahead.');
                const days=isB||isR?num('#bdays',0):1,q=isB?1:num('#bn',0);if(!(days>=1&&days<=60)||!(q>=1&&q<=100))return toast('Enter valid numbers.');
                const pm=priced?$('#bpm').value:'Cash',send=ref=>api('/bookings',{json:{kind:k,item_id:r.id,qty:q,days:days,date:dt,pay_method:pm,pay_ref:ref}}),finish=async msg=>{m.remove();toast(msg);await refresh();go('#/app/mybk');render()};
                if(pm=='UPI'){payPage({title:'Pay for '+r.name,total:tot(),lines:[{name:r.name+(isB||isR?' ('+days+(isR?' nights':' days')+')':'')+(isB?'':' × '+q),amount:tot()}],done:async ref=>{await send(ref);await finish('Booked! Admin will verify your payment.')}});return}
                await send('');await finish('Booked! Pay at arrival.')})}}
        else if(d.enq!==undefined){const n=$('#en').value.trim(),mo=$('#em').value.trim(),x=$('#ex').value.trim();if(!n||!x)return toast('Add your name and a message.');if(mo&&!/^[0-9+\s-]{7,15}$/.test(mo))return toast('Enter a valid mobile number.');run(async()=>{await api('/enquiries',{json:{name:n,mob:mo,msg:x}});$('#en').value=$('#em').value=$('#ex').value='';toast('Enquiry sent')})}});
    async function doAuth(signup){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,er=$('#err');
        if(!/^\S+@\S+\.\S+$/.test(u))return er.textContent='Enter a valid email address.';
        if(p.length<6)return er.textContent='Password needs at least 6 characters.';
        if(signup&&p!=$('#p2').value)return er.textContent='Passwords do not match.';
        const nm=signup?$('#nm').value.trim():'',mob=signup?$('#mob').value.trim():'';if(signup&&nm.length<2)return er.textContent='Enter your full name.';if(signup&&!/^\+?[0-9\s-]{10,15}$/.test(mob))return er.textContent='Enter a valid mobile number (10 digits).';
        try{const r=await api(signup?'/auth/signup':'/auth/login',{json:{email:u,password:p,name:nm,phone:mob}});S.user=r.user;await refresh();go(S.user.role=='admin'?'#/admin/dash':'#/app/dash')}catch(x){er.textContent=x.message}}
    document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.closest('.abox'))$('.abox [data-auth]').click()});
    const sig=()=>JSON.stringify([S.buses,S.rooms,S.foods,S.places,S.bookings,S.exps,S.trips,S.treq]);
    setInterval(async()=>{if(!S.user||document.hidden||document.querySelector('.modal'))return;const h=location.hash;if(!(h.startsWith('#/admin')||h.startsWith('#/app')))return;const tab=h.split('/')[2]||'dash';if(!['dash','mybk','buses','rooms','foods','places','bookings','exp','trips','treq','types'].includes(tab))return;const before=sig();await refresh(true);if(sig()!==before)render(true)},8000);
    (async()=>{try{S.user=(await api('/me')).user}catch(e){}await refresh();render()})();
</script></body></html>
